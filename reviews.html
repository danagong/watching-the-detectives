<script>

    var tooltips = document.querySelectorAll('.tooltip span');

    function validateForm() {
        console.log("hello");
        let x = document.forms["reviewForm"]["rating"].value
        console.log(x);
        if(x != '5') {
            alert("You can't rate such an amazing movie less than 5 stars :)")
        }
    }

    window.onmousemove = function (e) {
        var x = (e.clientX + 20) + 'px',
            y = (e.clientY) + 'px';
        for (var i = 0; i < tooltips.length; i++) {
            tooltips[i].style.top = y;
            tooltips[i].style.left = x;
        }
    };

    var main = function () {
        $('.btn').click(function () {
            console.log('clicked')
            var stars = $('.rating').val();
            var post = $('.status-box').val();
            $('<li>').text(stars + '</br>' + post).prependTo('.posts');

            $('.status-box').val('');
            $('.counter').text('250');
            $('.btn').addClass('disabled');
        });
        $('.status-box').keyup(function () {
            var postLength = $(this).val().length;
            var charactersLeft = 350 - postLength;
            $('.counter').text(charactersLeft);
            if (charactersLeft < 0) {
                $('.btn').addClass('disabled');
            } else if (charactersLeft === 350) {
                $('.btn').addClass('disabled');
            } else {
                $('.btn').removeClass('disabled');
            }
        });
    }
    $('.btn').addClass('disabled');
    $(document).ready(main)
</script>

<body>


    <section class="layout">
        <!--  -->
        <div class="body-content">

                    </ul>

                </nav>

                <div class="review">

                    <div class="review-elements">


                        <h3 class="heading">Leave a review for the movie here:</h3>
<form 
  name="reviewForm"
  method="POST" 
  action="https://script.google.com/macros/s/AKfycbwRfNwHFPQF8cQUr1xsbniAx6qLWMIjtQJk9FTGGLXU-KT7tPP4UBg7lQv9XYY-alv8Aw/exec"
  onsubmit="return validateForm()"
>
  <input name="Email" type="email" placeholder="Email">
  <input name="Name" type="text" placeholder="Name" required>
  <br />
  <br />
  <div class="rating"> 
    <input type="radio" name="rating" value="5" id="5"><label
        for="5">☆</label> <input type="radio" name="rating" value="4" id="4"><label
        for="4">☆</label> <input type="radio" name="rating" value="3" id="3"><label
        for="3">☆</label> <input type="radio" name="rating" value="2" id="2"><label
        for="2">☆</label> <input type="radio" name="rating" value="1" id="1"><label
        for="1">☆</label> </div>

        <br/><br/>


  <strong>Thoughts on the movie and your note for Dana?<br/></strong>
  <input name="Message" class="status-box" type="text" placeholder="This was the best movie I've ever seen...." required>
  <button type="submit">Send</button>

</form>


                    </div>
                </div>
            </div>
        </div>

        </div>
